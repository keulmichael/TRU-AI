[project]
name = "tru-ai"
version = "0.9.6"
description = "Artificial Intelligence for the Universal Reflexivity Theory"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn",
    "networkx",
    "numpy",
    "pandas",
    "scikit-learn",
    "pydantic",
    "typer",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["tru_ai*"]
exclude = ["backend*", "scripts*", "tests*"]

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".ruff_cache",
    ".venv",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
]

[tool.ruff.lint]
select = ["F"]

[tool.mypy]
python_version = "3.11"
files = ["tru_ai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
